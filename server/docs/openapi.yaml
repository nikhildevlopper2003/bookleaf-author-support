openapi: 3.0.3
info:
  title: BookLeaf Author Support API
  version: 1.0.0
  description: |
    REST API behind the author and admin portals. All routes except `/health` and `/auth/login`
    require `Authorization: Bearer <jwt>`. Errors share one shape:
    `{ "error": { "message": "...", "details": [{ "field": "...", "message": "..." }] } }`
servers:
  - url: /api
security:
  - bearer: []
tags:
  - name: Auth
  - name: Books
  - name: Tickets
  - name: Realtime

paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200': { description: OK }

  /auth/login:
    post:
      tags: [Auth]
      summary: Email and password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Token and user, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { description: Incorrect email or password }
        '429': { description: Too many failed attempts }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200': { description: The authenticated user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /books:
    get:
      tags: [Books]
      summary: List books
      description: Authors receive their own books only. Admins receive all books, optionally filtered by `authorId`.
      parameters:
        - { name: authorId, in: query, schema: { type: string }, description: Admin only }
      responses:
        '200': { description: Book list }

  /books/{id}:
    get:
      tags: [Books]
      summary: Get one book
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: BK001 } }
      responses:
        '200': { description: Book }
        '404': { description: Not found, or belongs to another author }

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets
      description: |
        Author: their own tickets, newest activity first, with message threads.
        Admin: the whole queue, ordered unresolved first, then priority (Critical to Low), then oldest first.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: assigned, in: query, schema: { type: string, enum: [me, unassigned] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Created on or after }
        - { name: to, in: query, schema: { type: string, format: date }, description: Created on or before }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Search subject, text or author name }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: "Author: { items }. Admin: { items, total }" }
        '400': { $ref: '#/components/responses/Validation' }
    post:
      tags: [Tickets]
      summary: Raise a ticket (authors only)
      description: Returns immediately. Category and priority are assigned asynchronously (AI, or keyword rules if the AI is unavailable).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                bookId: { type: string, nullable: true, description: Null for General / Account level }
                subject: { type: string, minLength: 3, maxLength: 150 }
                description: { type: string, minLength: 10, maxLength: 5000 }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { description: Admins cannot raise tickets }

  /tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Tickets]
      summary: Get a ticket with its thread
      description: Admin view adds category, priority, their sources, assignee, AI reasoning and internal notes. Authors get 404 for tickets that are not theirs.
      responses:
        '200': { description: Ticket }
        '404': { description: Not found }
    patch:
      tags: [Tickets]
      summary: Update status, override category or priority, assign (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/Status' }
                category: { $ref: '#/components/schemas/Category' }
                priority: { $ref: '#/components/schemas/Priority' }
                assignee: { type: string, enum: [me, none] }
      responses:
        '200': { description: Updated ticket }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { description: Authors cannot update tickets }

  /tickets/{id}/messages:
    post:
      tags: [Tickets]
      summary: Post into the thread
      description: |
        Author: follow-up message (re-opens a Resolved ticket; rejected on Closed).
        Admin: reply visible to the author. Moves Open to In Progress unless `status` is given, and assigns the ticket if unassigned.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '201': { description: Updated ticket }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { description: Not found }

  /tickets/{id}/notes:
    post:
      tags: [Tickets]
      summary: Add an internal note (admins only, never shown to the author)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Updated ticket }
        '403': { description: Admins only }

  /tickets/{id}/draft:
    get:
      tags: [Tickets]
      summary: AI-drafted reply (admins only)
      description: |
        Built from the ticket, the linked book data and the matching knowledge base section. Cached until the thread or category changes; `refresh=true` forces regeneration.
        Never fails because of the AI: when the model is unreachable the response is `{ "draft": null, "aiAvailable": false }` and the admin writes the reply manually.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: refresh, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: Draft result
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { type: string, nullable: true }
                  cached: { type: boolean }
                  aiAvailable: { type: boolean }
                  pending: { type: boolean, description: True while triage has not finished }

  /events:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream
      description: |
        Emits `ticket.updated` with `{ "ticketId": n }` whenever a ticket the caller can see changes. Authors receive events for their own tickets, admins for all. Clients refetch via the REST API.
        EventSource cannot set headers, so the JWT may be passed as `?token=`.
      responses:
        '200': { description: text/event-stream }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Status: { type: string, enum: [Open, In Progress, Resolved, Closed] }
    Priority: { type: string, enum: [Critical, High, Medium, Low] }
    Category:
      type: string
      enum:
        - Royalty & Payments
        - ISBN & Metadata Issues
        - Printing & Quality
        - Distribution & Availability
        - Book Status & Production Updates
        - General Inquiry
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            role: { type: string, enum: [author, admin] }
            authorId: { type: string, nullable: true }
  responses:
    Unauthorized: { description: Missing, invalid or expired token }
    Validation: { description: Validation failed, with per-field details }
